<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>FireBox</title>
<link rel="stylesheet" href="style.css?v=35" />
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<!-- Three.js's examples/jsm addon modules (used by novaStrike.js for bloom
     post-processing) import the bare specifier "three" internally, which
     only resolves via an import map -- without this, any page that loads
     those addons fails to even parse main.js. Must stay pinned to the exact
     same three@ version novaStrike.js imports directly, or Three.js will
     throw about mismatched/duplicate instances. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"
  }
}
</script>
</head>
<body>
  <div id="app">
    <video id="webcam" autoplay playsinline muted></video>
    <div id="canvasStack">
      <canvas id="output"></canvas>
      <canvas id="post-canvas"></canvas>
      <canvas id="three-canvas" class="hidden"></canvas>
      <canvas id="fx-canvas" class="hidden"></canvas>
      <div id="vignette"></div>
    </div>

    <div id="hud" class="hidden">
      <div id="hudLeft">Score: 0</div>
      <button id="pauseBtn" type="button">Pause</button>
      <div id="hudRight">Lives: ❤❤❤</div>
    </div>

    <div id="overlay">
      <h1>FireBox</h1>
      <p id="status">Loading camera + pose model...</p>
    </div>

    <div id="errorBanner" class="hidden"></div>
  </div>

  <script type="module" src="main.js?v=132"></script>
</body>
</html>
