<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FireBox</title>
<link rel="stylesheet" href="style.css?v=11" />
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div id="app">
    <video id="webcam" autoplay playsinline muted></video>
    <div id="canvasStack">
      <canvas id="output"></canvas>
      <canvas id="three-canvas" class="hidden"></canvas>
      <canvas id="fx-canvas" class="hidden"></canvas>
    </div>

    <div id="hud" class="hidden">
      <div id="hudLeft">Score: 0</div>
      <button id="pauseBtn" type="button">Pause</button>
      <div id="hudRight">Lives: ❤❤❤</div>
    </div>

    <div id="overlay">
      <h1>FireBox</h1>
      <p id="status">Loading camera + pose model...</p>
    </div>
  </div>

  <script type="module" src="main.js?v=34"></script>
</body>
</html>
